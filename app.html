<!DOCTYPE html>
<html lang="en-IE">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16212E">
<title>Trayclear Demo | Byrne Building Services</title>
<meta name="description" content="Trayclear demo: the quoting workflow running on fictional data for Byrne Building Services. Classroom prototype.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%2316212E'/><text x='16' y='23' font-family='Arial' font-size='18' font-weight='bold' fill='%23E8A33D' text-anchor='middle'>B</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<a class="skip" href="#main">Skip to main content</a>

<!-- ============ DEMO BANNER ============ -->
<div class="demo-strip" role="note">
  <span class="dot"></span>
  <strong>Demo</strong>
  <span class="sep">·</span>
  <span>Fictional demo data</span>
  <span class="sep">·</span>
  <span>Demo date <time datetime="2026-09-18">Fri 18 Sep 2026</time></span>
  <a class="strip-link" href="index.html">About Trayclear <span aria-hidden="true">&rarr;</span></a>
</div>

<!-- ============ CHALLENGE BAR ============ -->
<div id="challengeBar" class="challenge-bar" hidden role="timer" aria-live="off">
  <div class="cb-left">
    <span class="cb-label">2-Minute Challenge</span>
    <span class="cb-hint" id="cbHint">Price this job and approve it.</span>
  </div>
  <div class="cb-right">
    <span class="cb-clock" id="cbClock">2:00</span>
    <button type="button" class="cb-quit" id="cbQuit">Stop</button>
  </div>
</div>

<header class="topbar">
  <a class="brand" href="index.html" aria-label="Trayclear home page">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 14h4l2 3h6l2-3h4M3 14l2.5-8h13L21 14v5H3z"/><path d="M9 9.5l2 2 4-4"/></svg></span>
    <span class="brand-text">
      <strong>Byrne Building Services</strong>
      <span>Trayclear <em>Demo</em></span>
    </span>
  </a>
  <div class="topbar-actions">
    <button type="button" class="btn btn-accent" id="startChallenge">Start Gerry's 2-Minute Challenge</button>
    <button type="button" class="btn btn-ghost" id="resetDemo">Reset demo</button>
  </div>
</header>

<div class="shell">

  <!-- ============ SIDE NAV (desktop) / BOTTOM NAV (mobile) ============ -->
  <nav class="nav" aria-label="Main">
    <a href="#/tray" data-route="tray" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 14h4l2 3h6l2-3h4M3 14l2.5-8h13L21 14v5H3z"/></svg>
      <span>Gerry's tray</span><span class="nav-badge" id="badgeTray">0</span>
    </a>
    <a href="#/intake" data-route="intake" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      <span>New job</span>
    </a>
    <a href="#/office" data-route="office" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11M9 20v-6h6v6"/></svg>
      <span>Office</span><span class="nav-badge warn" id="badgeOffice">0</span>
    </a>
    <a href="#/history" data-route="history" class="nav-item">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7M3 4v4h4M12 7v5l3 2"/></svg>
      <span>History</span>
    </a>
  </nav>

  <main id="main" class="main"><!-- views render here --></main>

</div>

<!-- ============ RESULT DIALOG ============ -->
<div class="overlay" id="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="dlgTitle" id="dialog">
    <h2 id="dlgTitle">Result</h2>
    <div id="dlgBody"></div>
    <div class="dlg-actions" id="dlgActions"></div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script src="app.js"></script>
</body>
</html>
